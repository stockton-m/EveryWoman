name: Sync external content

on:
  schedule:
    - cron: "23 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-external-content-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    name: Synchronize archive
    runs-on: ubuntu-latest

    steps:
      - name: Check out the latest default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Synchronize external content
        run: pnpm content:sync
        env:
          APIFY_TASK_ID: ${{ secrets.APIFY_TASK_ID }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          BEHOLD_FEED_URL: ${{ secrets.BEHOLD_FEED_URL }}

      - name: Detect archive changes
        id: changes
        run: |
          git add -- src/data/content-archive.json
          if compgen -G "public/tiktok/*" > /dev/null; then
            git add -- public/tiktok
          fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The content archive is already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push archive changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(content): sync external posts"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
